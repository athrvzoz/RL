<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#151B2F; --muted:#5B647A; --line:#D6DCE7;
  --accent:#2C4BD1; --accent-soft:#E8ECFB; --gold:#A86A08; --gold-soft:#FBF3E2;
  --good:#1E8A5A; --good-soft:#E3F3EA; --bad:#C2413A; --bad-soft:#FBE7E5; --code:#F1F3F8;
  --f-body:"Segoe UI", system-ui, sans-serif;
  --f-mono:Consolas, "Cascadia Mono", monospace;
}
@page{size:A4;margin:15mm 15mm 16mm}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:10.6pt;line-height:1.55;margin:0}
main{max-width:180mm;margin:0 auto}
h1{font-size:30pt;line-height:1.05;margin:0 0 8px;font-weight:800;letter-spacing:-.01em}
h2{font-size:19pt;line-height:1.15;margin:0 0 4px;font-weight:800;break-before:page;padding-top:2px}
h2 .n{font-family:var(--f-mono);font-size:11pt;color:var(--accent);vertical-align:4pt;margin-right:8px}
h3{font-size:13pt;margin:18px 0 6px;font-weight:700;break-after:avoid}
h4{font-size:11pt;margin:12px 0 4px;break-after:avoid}
.sub{color:var(--muted);margin:0 0 12px;font-size:11pt}
p{margin:0 0 9px}
ul,ol{margin:0 0 9px;padding-left:1.3em}
li{margin-bottom:3px}
code{font-family:var(--f-mono);font-size:.9em;background:var(--code);padding:0 4px;border-radius:3px}
pre{font-family:var(--f-mono);font-size:8.6pt;line-height:1.45;background:var(--code);border:1px solid var(--line);border-radius:5px;padding:10px 12px;margin:0 0 10px;white-space:pre-wrap;break-inside:avoid}
pre .c{color:#5B647A}
pre .k{color:var(--accent);font-weight:700}
pre .h{background:#FFF0C2}
.box{padding:10px 13px;margin:10px 0;border-radius:5px;break-inside:avoid}
.box > :last-child{margin-bottom:0}
.tag{display:block;font-family:var(--f-mono);font-size:8pt;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px;font-weight:700}
.plain{background:var(--accent-soft)} .plain .tag{color:var(--accent)}
.key{border:2px solid var(--ink)} .key .tag{color:var(--ink)}
.warn{background:var(--gold-soft);border:1px solid #E6CC97} .warn .tag{color:var(--gold)}
.ok{background:var(--good-soft)} .ok .tag{color:var(--good)}
table{border-collapse:collapse;width:100%;font-size:9.6pt;margin:6px 0 12px;break-inside:avoid}
table.long{break-inside:auto} table.long tr{break-inside:avoid}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:8pt;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#F5F6FA}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
figure{margin:10px 0 14px;break-inside:avoid}
figure svg{display:block;width:100%;height:auto}
figure img{display:block;width:100%;border:1px solid var(--line);border-radius:4px}
figcaption{font-size:9pt;color:var(--muted);margin-top:5px}
svg text{font-family:var(--f-body);font-size:13px;fill:currentColor}
svg .t-m{fill:#5B647A} svg .t-a{fill:#2C4BD1;font-weight:700} svg .t-g{fill:#1E8A5A;font-weight:700} svg .t-b{fill:#C2413A;font-weight:700}
svg .t-h{font-weight:700;font-size:12px;letter-spacing:.06em}
svg .bx{fill:#fff;stroke:#151B2F;stroke-width:1.4}
svg .bxa{fill:#E8ECFB;stroke:#2C4BD1;stroke-width:1.6}
svg .bxg{fill:#E3F3EA;stroke:#1E8A5A;stroke-width:1.6}
svg .ln{fill:none;stroke:#151B2F;stroke-width:1.5}
svg .lna{fill:none;stroke:#2C4BD1;stroke-width:2.2}
svg .lnd{fill:none;stroke:#9AA3B9;stroke-width:1.4;stroke-dasharray:5 4}

/* gridworld boards */
.boards{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px;break-inside:avoid}
.board{break-inside:avoid}
.board .cap{font-family:var(--f-mono);font-size:8pt;color:var(--muted);margin-bottom:3px}
table.gw{width:auto;border-collapse:separate;border-spacing:2px;margin:0;font-family:var(--f-mono);font-size:8pt}
table.gw td{width:40px;height:30px;padding:0;text-align:center;vertical-align:middle;border:1px solid var(--line);border-radius:3px;line-height:1.1}
table.gw.big td{width:62px;height:46px;font-size:9.5pt}
table.gw.big td b{display:block;font-size:13pt;font-family:var(--f-body)}
td.wall{background:repeating-linear-gradient(45deg,#D6DCE7 0 3px,#fff 3px 7px)}
td.G{background:#2E9E68;color:#fff;font-weight:700} td.P{background:#D2564F;color:#fff;font-weight:700}
td.H{background:#1F3B57;color:#fff;font-weight:700}
td.g3{background:#8ED1AE} td.g2{background:#B9E3CB} td.g1{background:#E3F3EA} td.ng{background:#FBE7E5}
td.new{outline:2px solid var(--accent);outline-offset:-2px}
td.ice{background:#DDEEFF}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cover{height:240mm;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-family:var(--f-mono);font-size:9pt;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.lede{font-size:13pt;color:var(--muted);max-width:150mm}
.toc{margin-top:26px;columns:2;column-gap:24px;font-size:10.5pt}
.toc div{break-inside:avoid;padding:3px 0;border-bottom:1px solid var(--line)}
.toc span{font-family:var(--f-mono);color:var(--accent);margin-right:8px}
.qa{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:0 0 12px;break-inside:avoid}
.qa .q{font-weight:700;margin-bottom:3px}
.qa .q::before{content:"Q. ";color:var(--accent)}
.wrong{color:var(--bad);font-weight:700} .right{color:var(--good);font-weight:700}
</style>
